# DreamPort 薄插件配置（完整字段说明见 docs/PROJECT_DOCUMENTATION.md §7.3）

# 语言：zh | en
language: zh

# 运行角色：primary（主服，含进服校验） | secondary（子服，仅上报） | proxy（Velocity/BungeeCord 统一拦截）
role: primary

bstats:
  enabled: true         # 匿名统计（可关）

backend:
  url: "http://127.0.0.1:18898"
  server-id: "main"
  # 显示名(心跳/网页服务器列表展示);留空则回退 server-id
  server-name: ""
  # 与后端 wl.internal.server-token 保持一致;部署时必须配置,空串会导致后端拒绝
  server-token: ""

check:
  fail-policy: cache     # 后端不可达时的兜底：cache（用最近缓存）| allow（放行）| deny（拒绝）
  cache-ttl-seconds: 60
  timeout-ms: 1500

features:
  enforce-whitelist: true
  forward-chat: true
  report-join-quit: true
  receive-chat: true            # 接收网页/QQ 消息并游戏内广播（docs/ASTRBOT_PLAN.md §5.3）
  message-poll-seconds: 2       # 游戏收件箱轮询间隔（秒）
  report-metrics: true          # 心跳附带 TPS/内存/CPU 指标上报（后台资源看板数据源）
  report-locations: true        # 家(Essentials)+死亡位置上报（网页地图「我的位置」，仅本人可见）

# 群组服玩家数据(经济/时长)上报策略:
#   auto = 仅主服(role: primary)上报(推荐,群组服指定主服推送,避免多服快照互相覆盖)
#   on   = 本服始终上报   |   off = 本服不上报
economy:
  report: auto

# 未注册玩家踢出提示中的注册地址
web-register-url: "http://localhost:18898"

# 心跳与采集间隔（秒）
tasks:
  heartbeat-interval: 60
  whitelist-poll-interval: 30
  economy-interval: 300
