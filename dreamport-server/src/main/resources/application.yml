spring:
  application:
    name: dreamport-server
  # 部署配置：首次启动会在工作目录生成 config.yml（数据库/JWT/SMTP 等一处配置），
  # 由 DreamPortConfigInitializer 自动加载，优先级高于本文件、低于命令行参数与环境变量。
  threads:
    virtual:
      enabled: true
  datasource:
    # dev 默认 H2（MySQL 兼容模式），无需安装数据库即可启动；生产用 --spring.profiles.active=mysql
    url: jdbc:h2:mem:dreamport;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: ""
  flyway:
    locations: classpath:db/migration/{vendor}
    # 旧库（非空 schema）接入时自动建立基线，随后增量迁移
    # baseline-version 必须为 0，否则 V1 建表会被基线吞掉
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    default-property-inclusion: non_null

server:
  port: 18898

wl:
  ws-port: 18899             # WebSocket 端口（可被工作目录 config.yml 覆盖）
  version: 0.1.0
  security:
    # 生产必须通过环境变量 WL_JWT_SECRET 覆盖（Rules.md §5）
    jwt-secret: ${WL_JWT_SECRET:dev-only-change-me-0123456789abcdef0123456789abcdef}
    jwt-ttl-days: 7
  internal:
    # 服务器间通信令牌；插件 backend.server-token 需一致（生产用 WL_SERVER_TOKEN）
    server-token: ${WL_SERVER_TOKEN:dev-internal-token}
  cors:
    allowed-origins: "*"
  seed-demo: true    # 首次启动播种演示账号（生产置 false）
  web-register-url: "http://localhost:18898"
  admin-notify-email: ""
  mail:
    host: ${WL_SMTP_HOST:}        # 留空 = 日志模式（不发信，仅打印）；生产填 SMTP
    port: ${WL_SMTP_PORT:465}
    username: ${WL_SMTP_USER:}
    password: ${WL_SMTP_PASSWORD:}
    from: ${WL_SMTP_FROM:no_reply@xmcraft.cn}
    ssl: true
    subject: ""
  questionnaire:
    enabled: true
    pass-score: 60
  llm:
    enabled: false   # 问卷 AI 评分（OpenAI 兼容接口）；不启用时按长度降级评分
    api-base: "https://api.deepseek.com/v1"
    api-key: ""
    model: "deepseek-chat"
    timeout-ms: 10000
    max-concurrency: 4
    system-prompt: "你是一位公正的 Minecraft 白名单问卷评分员。严格根据问题、候选人回答和评分规则进行评分。仅返回 JSON。"
  invite:
    enabled: true
    code-expiry-days: 7
    max-invites-per-user: 3
  migration:
    enabled: true                  # 启动时自动检测旧库并迁移（幂等）
    legacy-dir: ""                 # 旧版 file 模式目录（含 users.json/audits.json）
    legacy-config: ""              # 旧版 config.yml 路径（站点内容导入 dp_setting）

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${WL_DB_HOST:127.0.0.1}:${WL_DB_PORT:3306}/${WL_DB_NAME:dreamport}?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: ${WL_DB_USER:dreamport}
    password: ${WL_DB_PASSWORD:change-me}
