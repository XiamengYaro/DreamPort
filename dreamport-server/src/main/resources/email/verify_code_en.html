<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin: 0; padding: 20px; background-color: #f5f5f4;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width: 600px; width: 100%; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06); font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;">
        <tr><td>
<!-- 页眉：logo 左上 + 站名 -->
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td style="padding: 24px 32px 16px 32px;" align="left">
                      <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
                        {logo_cell}
                        <td style="font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 20px; font-weight: bold; color: #1c1917; vertical-align: middle;">{server_name}</td>
                      </tr></table>
                    </td>
                  </tr>
                  <tr><td style="height: 3px; background-color: #f97316; font-size: 0; line-height: 0;">&nbsp;</td></tr>
                </table>
          <!-- 内容区 -->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
            <tr><td style="padding: 32px;">
<p style="margin: 0 0 8px 0; font-size: 16px; color: #1c1917;">Hello! Your verification code is:</p><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td align="center" style="padding: 24px; margin: 16px 0; background-color: #fff7ed; border: 2px dashed #fdba74; border-radius: 12px;">
                  <span style="font-size: 36px; font-weight: bold; color: #ea580c; letter-spacing: 10px; font-family: 'Courier New', monospace;">{code}</span>
                </td></tr></table>
                <p style="margin: 16px 0 0 0; color: #a8a29e; font-size: 13px;">Valid for 5 minutes. If you did not request this, please ignore this email.</p>
            </td></tr>
          </table>
<!-- 页脚 -->
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr><td style="padding: 20px 32px; background-color: #fafaf9; text-align: center; font-family: Arial, 'PingFang SC', sans-serif; font-size: 12px; color: #a8a29e;">
                    此邮件由系统自动发送，请勿直接回复<br/>
                    <a href="{site_url}" style="color: #f97316; text-decoration: none;">{server_name} · 访问官网</a>
                  </td></tr>
                </table>
        </td></tr>
      </table>
    </td></tr></table>
</body>
</html>
