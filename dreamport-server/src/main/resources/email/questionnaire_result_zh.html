<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XMCraft - 问卷评审结果</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; background: #fef7ed; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 32px rgba(249, 115, 22, 0.08); }
        .header { background: linear-gradient(135deg, #f97316 0%, #fb923c 100%); color: white; padding: 32px; text-align: center; }
        .header h1 { margin: 0; font-size: 22px; font-weight: 600; }
        .content { padding: 32px; color: #1c1917; }
        .score-box { background: rgba(249, 115, 22, 0.06); border-radius: 16px; padding: 24px; margin: 24px 0; text-align: center; }
        .score { font-size: 56px; font-weight: 700; letter-spacing: -2px; }
        .score.passed { color: #16a34a; }
        .score.failed { color: #dc2626; }
        .result-item { padding: 16px 0; border-bottom: 1px solid rgba(0,0,0,0.04); }
        .result-item:last-child { border-bottom: none; }
        .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .question { color: #78716c; font-size: 14px; font-weight: 500; }
        .score-detail { font-weight: 600; font-size: 14px; }
        .score-detail.high { color: #16a34a; }
        .score-detail.mid { color: #f59e0b; }
        .score-detail.low { color: #dc2626; }
        .reason { color: #57534e; font-size: 13px; background: rgba(249, 115, 22, 0.04); padding: 10px 14px; border-radius: 10px; margin-top: 8px; }
        .answer { color: #1e40af; font-size: 13px; background: #eff6ff; padding: 10px 14px; border-radius: 10px; margin-top: 8px; }
        .footer { background: #fef7ed; padding: 20px; text-align: center; color: #a8a29e; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>XMCraft</h1>
        </div>
        <div class="content">
            <p>你好 {username}，你的入服审核问卷已评审完成：</p>
            <div class="score-box">
                <div class="score {passed_class}">{totalScore}/{maxScore}</div>
                <div style="margin-top: 12px; color: #78716c; font-size: 15px;">{passed_text}</div>
            </div>
            <h3 style="color: #1c1917; font-size: 16px; font-weight: 600; margin: 24px 0 12px;">答题详情与 AI 评语</h3>
            {result_items}
            {overall_summary}
        </div>
        <div class="footer">
            <p>此邮件由 XMCraft 白名单系统 自动发送</p>
        </div>
    </div>
</body>
</html>
