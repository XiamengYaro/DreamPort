<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin: 0; padding: 20px; background-color: #f5f5f4;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width: 600px; width: 100%; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06); font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;">
        <tr><td>
<!-- 页眉：logo 左上 + 站名 -->
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td style="padding: 24px 32px 16px 32px;" align="left">
                      <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
                        {logo_cell}
                        <td style="font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 20px; font-weight: bold; color: #1c1917; vertical-align: middle;">{server_name}</td>
                      </tr></table>
                    </td>
                  </tr>
                  <tr><td style="height: 3px; background-color: #f97316; font-size: 0; line-height: 0;">&nbsp;</td></tr>
                </table>
          <!-- 内容区 -->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
            <tr><td style="padding: 32px;">
<p style="margin: 0 0 16px 0; font-size: 16px; color: #1c1917;">你好 {username}，你的入服审核问卷已评审完成：</p>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td align="center" style="padding: 24px; border-radius: 12px;" bgcolor="{passed_bg}">
                  <div class="{passed_class}" style="font-size: 44px; font-weight: bold; color: {passed_color};">{totalScore}/{maxScore}</div>
                  <div style="font-size: 15px; color: {passed_color}; margin-top: 6px;">{passed_text}</div>
                </td></tr></table>
                <h3 style="color: #1c1917; font-size: 16px; font-weight: 600; margin: 24px 0 12px; font-family: Arial, 'PingFang SC', sans-serif;">答题详情与 AI 评语</h3>
                {result_items}
                <div style="padding: 12px 16px; background-color: #f5f5f4; border-radius: 8px; font-size: 13px; color: #44403c; line-height: 1.8; font-family: Arial, 'PingFang SC', sans-serif;">
                  <strong>总评：</strong>{overall_summary}
                </div>
            </td></tr>
          </table>
<!-- 页脚 -->
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr><td style="padding: 20px 32px; background-color: #fafaf9; text-align: center; font-family: Arial, 'PingFang SC', sans-serif; font-size: 12px; color: #a8a29e;">
                    此邮件由系统自动发送，请勿直接回复<br/>
                    <a href="{site_url}" style="color: #f97316; text-decoration: none;">{server_name} · 访问官网</a>
                  </td></tr>
                </table>
        </td></tr>
      </table>
    </td></tr></table>
</body>
</html>
