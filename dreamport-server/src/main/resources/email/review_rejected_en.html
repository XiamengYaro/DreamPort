<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XMCraft - Whitelist Rejected</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; background: #fef7ed; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 32px rgba(249, 115, 22, 0.08); }
        .header { background: linear-gradient(135deg, #f97316 0%, #dc2626 100%); color: white; padding: 32px; text-align: center; }
        .header h1 { margin: 0; font-size: 22px; font-weight: 600; }
        .content { padding: 32px; color: #1c1917; }
        .reason-box { background: rgba(249, 115, 22, 0.06); border-left: 4px solid #f97316; padding: 16px; margin: 20px 0; border-radius: 0 12px 12px 0; }
        .footer { background: #fef7ed; padding: 20px; text-align: center; color: #a8a29e; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>XMCraft</h1>
        </div>
        <div class="content">
            <p style="text-align:center; font-size:48px; margin:16px 0;">❌</p>
            <h2 style="text-align:center; color:#dc2626; margin:0 0 16px;">Whitelist Rejected</h2>
            <p>Dear {username},</p>
            <p>We regret to inform you that your whitelist application has been rejected.</p>
            <div class="reason-box"><strong>Reason:</strong> {reason}</div>
        </div>
        <div class="footer">
            <p>This email was automatically sent by XMCraft Whitelist System</p>
        </div>
    </div>
</body>
</html>
