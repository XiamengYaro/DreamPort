# ============================================================
#   DreamPort · 夏日小镇 · 梦港   部署配置
# ------------------------------------------------------------
#   首次启动自动生成；修改本文件后重启生效。
#   标注 [必改] 的项在生产环境必须修改。
#   环境变量可覆盖本文件（Docker/CI 场景），命令行参数优先级最高。
# ============================================================

server:
  port: 18898                  # 网页 / API 端口

# 上传旧库 dump 的体积上限（管理后台「数据迁移」用）
#spring.servlet.multipart:
#  max-file-size: 128MB
#  max-request-size: 128MB

wl:
  ws-port: 18899               # WebSocket 实时推送端口

  security:
    jwt-secret: "change-me-please-generate-a-real-secret-0123456789abcdef"  # [必改] 生成: openssl rand -base64 48
    jwt-ttl-days: 7                     # 登录令牌有效期（天）

  internal:
    server-token: "change-me-server-token"  # [必改] 服务器↔后端令牌（ASCII），需与插件 backend.server-token 一致

  cors:
    allowed-origins: "*"                # 生产建议改为 "https://你的域名"

  web-register-url: "http://localhost:18898"   # 注册页地址（进服提示/邮件链接用）
  admin-notify-email: ""                # 管理员通知邮箱（问卷通过提醒）

  mail:                                 # host 留空 = 日志模式（不发信，验证码打印在日志）
    host: ""
    port: 465
    username: ""
    password: ""
    from: "no_reply@xmcraft.cn"
    ssl: true
    subject: ""

  register:
    require-email-code: true            # 注册需邮箱验证码（邀请码注册豁免）
    captcha-enabled: true
    max-accounts-per-email: 2
    domain-whitelist-enabled: true
    email-domain-whitelist: [qq.com, 163.com, gmail.com, outlook.com, xmcraft.cn]
    auto-approve: false
  questionnaire:
    enabled: true                       # 注册流程是否要求问卷
    pass-score: 60                      # 通过线（百分制）

  llm:                                  # 问卷 AI 评分（OpenAI 兼容接口；不启用时文本题按长度评分）
    enabled: false
    api-base: "https://api.deepseek.com/v1"
    api-key: ""
    model: "deepseek-chat"
    timeout-ms: 10000
    max-concurrency: 4

  invite:
    enabled: true
    code-expiry-days: 7
    max-invites-per-user: 3

  migration:                            # 旧版 XMWhitelist 数据自动迁移（幂等）
    enabled: true
    legacy-dir: ""                      # 旧版 file 模式目录（含 users.json/audits.json）
    legacy-config: ""                   # 旧版 config.yml 路径（门户等内容导入后台）

# ============================================================
#  数据库 [必改]：仅支持 MySQL（库需 utf8mb4，先执行:
#  CREATE DATABASE dreamport CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;）
# ============================================================
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/dreamport?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: dreamport
    password: "数据库密码"
