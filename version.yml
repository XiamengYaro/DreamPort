version: 1.4.1
release_notes: |
  # DreamPort · 夏日小镇 · 梦港 v1.4.1

  ## 简体中文

  v1.4.1 为守则门死锁热修：修复玩家在控制台/验证页无法确认服务器守则，导致 ID 验证、绑定、改 ID 卡住的问题。

  - 验证页守则卡片不再被「已验证」状态隐藏——只要未同意守则即显示
  - 控制台(Dashboard)Minecraft 账户信息卡新增「服务器守则」同意区块

  v1.4.0 主要功能：守则门 · 积分任务系统 · 称号系统(游戏内 PAPI + /titles GUI + 网页展示佩戴 + 游戏内颜色可定义) · 奖励礼包发放 · 全仓库安全审计修复 · playertitle 旧称号数据迁移。

  ## English

  v1.4.1 hotfix for the rules-gate deadlock: players could not accept server rules on the dashboard/verify page,
  which blocked ID verification, binding and ID change.

  v1.4.0 added: rules gate, points & tasks, title system (in-game PAPI + /titles GUI + web equip + configurable
  in-game color), reward kits, full security audit fixes, and playertitle data migration.
