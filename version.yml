version: 1.5.1
release_notes: |
  # DreamPort · 夏日小镇 · 梦港 v1.5.1

  ## 简体中文

  v1.5.1 为体验热修：修复头像偶发显示默认脸(两类根因)与首页刷新闪烁，并重做时光照片墙视觉。

  - **头像偶发默认脸**：Mojang 瞬时故障(超时/429/5xx)降级的默认脸不再被缓存 1 小时——瞬时失败不写缓存(30s 重试节流)，下次请求自动重试；默认脸浏览器缓存降为 60 秒
  - **玩家列表/详情头像**：头像改按「绑定 MC 名 → 账号名」解析，改过 ID 的玩家不再显示默认脸
  - **首页刷新闪烁**：揭幕等待真实背景图解码完成；配置本地缓存，刷新秒出内容不蹦出
  - **时光照片墙改版「杂志瀑布流」**：原图比例错落排布、衬线刊头/年份水印、kicker 筛选、hover 动效(分类筛选/放大留言/后台配置不变)

  升级提示：替换后端 JAR 即可(无新增迁移)；前端产物已内嵌。

  ## English

  v1.5.1 experience hotfix: avatars occasionally showing the default face (two root causes), homepage
  refresh flash, and a visual rework of the photo wall.

  - **Avatar default-face flashes**: transient Mojang failures (timeouts/429/5xx) no longer poison the
    skin cache for an hour — transient failures bypass caching (30s retry throttle); the browser
    default-face cache drops to 60s
  - **Players list/profile avatars**: resolved by bound Minecraft name first (then account name),
    so renamed players no longer show the default face
  - **Homepage refresh flash**: reveal waits for the actual background image to decode; config is
    locally cached so content renders instantly
  - **Photo wall rework "editorial masonry"**: natural aspect ratios, serif year watermarks, kicker
    filters, hover microinteractions (filters/lightbox/admin config unchanged)

  Upgrade: replace the backend JAR (no new migrations); frontend assets are embedded.
